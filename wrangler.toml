name = "asadaani-site"
compatibility_date = "2026-08-13"
main = "worker.js"

[assets]
directory = "./"
binding = "ASSETS"

# Create this KV namespace in the Cloudflare dashboard (Workers & Pages > KV),
# then replace the id below with the one it gives you.
# Storage > KV > Create namespace > name it "asadaani-pricing"
[[kv_namespaces]]
binding = "PRICING_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Runs the price-refresh job daily at 06:00 UTC.
[triggers]
crons = ["0 6 * * *"]
